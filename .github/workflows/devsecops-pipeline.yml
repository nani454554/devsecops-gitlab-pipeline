name: DevSecOps CI - Build + SAST

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

# 🔐 REQUIRED PERMISSIONS (CRITICAL FIX)
permissions:
  contents: read
  security-events: write
  actions: read

env:
  REGISTRY: docker.io
  IMAGE_NAMESPACE: ${{ secrets.DOCKER_USERNAME }}

jobs:
  sast:
    name: SAST - Source Code Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=nani454554_devsecops-gitlab-pipeline
            -Dsonar.organization=nani454554
            -Dsonar.sources=services
            -Dsonar.python.version=3.11
            -Dsonar.branch.name=${{ github.ref_name }}

      # FS scan = secrets + misconfig ONLY (correct stage)
      - name: Trivy FS Scan (Secrets & Misconfig)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: services/
          scanners: secret,config
          severity: HIGH,CRITICAL
          exit-code: 1
          format: sarif
          output: trivy-fs-secrets.sarif

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs-secrets.sarif

  build:
    name: Build services
    runs-on: ubuntu-latest
    needs: sast

    strategy:
      matrix:
        service:
          - user-service
          - health-service

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          push: false
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}
