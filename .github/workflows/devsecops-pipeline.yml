name: DevSecOps CI - Build + SAST + SCA

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read
  security-events: write
  actions: read

env:
  REGISTRY: docker.io
  IMAGE_NAMESPACE: ${{ secrets.DOCKER_USERNAME }}

jobs:
  # ------------------------
  # SAST
  # ------------------------
  sast:
    name: SAST - Source Code Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=nani454554_devsecops-gitlab-pipeline
            -Dsonar.organization=nani454554
            -Dsonar.sources=services
            -Dsonar.python.version=3.11
            -Dsonar.branch.name=${{ github.ref_name }}

      - name: Trivy FS Scan (Secrets & Misconfig - report only)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: services/
          scanners: secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          exit-code: 0

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif

  # ------------------------
  # SCA
  # ------------------------
  sca:
    name: SCA - Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    needs: sast

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "devsecops-gitlab-pipeline"
          path: "services"
          format: "ALL"
          out: "dependency-check-report"
          args: >
            --enableExperimental
            --failOnCVSS 7

      - name: Upload Dependency-Check HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-html
          path: dependency-check-report/dependency-check-report.html

      - name: Upload Dependency-Check SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: dependency-check-report/dependency-check-report.sarif

  # ------------------------
  # BUILD
  # ------------------------
  build:
    name: Build services
    runs-on: ubuntu-latest
    needs: sca

    strategy:
      matrix:
        service:
          - user-service
          - health-service

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          push: false
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}
