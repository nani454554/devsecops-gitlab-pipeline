name: DevSecOps CI - Build + SAST + SCA + IMAGE + SIGN

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read
  security-events: write
  actions: read
  id-token: write   # REQUIRED for Cosign OIDC

env:
  REGISTRY: docker.io
  IMAGE_NAMESPACE: ${{ secrets.DOCKER_USERNAME }}
  COSIGN_EXPERIMENTAL: "true"

jobs:
  # =======================
  # SAST
  # =======================
  sast:
    runs-on: ubuntu-latest
    name: SAST - Source Code Security

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=nani454554_devsecops-gitlab-pipeline
            -Dsonar.organization=nani454554
            -Dsonar.sources=services
            -Dsonar.python.version=3.11
            -Dsonar.branch.name=${{ github.ref_name }}

      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: services/
          scanners: secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          exit-code: 0

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif

  # =======================
  # SCA
  # =======================
  sca:
    runs-on: ubuntu-latest
    needs: sast
    name: SCA - Dependency Vulnerability Scan

    steps:
      - uses: actions/checkout@v4

      - uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "devsecops-gitlab-pipeline"
          path: "services"
          format: "ALL"
          out: "dependency-check-report"
          args: >
            --enableExperimental
            --failOnCVSS 7

      - uses: actions/upload-artifact@v4
        with:
          name: dependency-check-html
          path: dependency-check-report/dependency-check-report.html

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: dependency-check-report/dependency-check-report.sarif

  # =======================
  # IMAGE + SIGN
  # =======================
  image:
    runs-on: ubuntu-latest
    needs: sca
    name: Image Scan, Push & Sign

    strategy:
      matrix:
        service:
          - user-service
          - health-service

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          load: true
          push: false
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}

      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}
          scanners: vuln
          vuln-type: library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif
          exit-code: 0

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif

      - name: Push image
        run: |
          docker push ${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (Keyless OIDC)
        run: |
          cosign sign --yes \
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}

      # ✅ FIXED VERIFICATION
      - name: Verify image signature (Keyless)
        run: |
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/nani454554/devsecops-gitlab-pipeline/.*" \
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}
